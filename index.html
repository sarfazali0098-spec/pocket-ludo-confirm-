<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Email confirmed - Pocket Ludo</title>
<style>
  :root{--bg:#1a1530;--card:#2a2444;--cream:#f6eedc;--muted:#b9b1d1;--green:#2fae5f;--yellow:#f3b61f}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:100%;max-width:380px;text-align:center}
  .tick{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #1c7a41}
  .tick svg{width:44px;height:44px}
  h1{font-size:30px;line-height:1.15;margin:0 0 12px;font-weight:800}
  p{font-size:18px;line-height:1.5;margin:0;color:var(--muted)}
  .game{color:var(--yellow);font-weight:700}
</style>
</head>
<body>
<main>
  <div class="tick" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1>Email confirmed</h1>
  <p>Your email has been verified. Now go back to <span class="game">Pocket Ludo</span> and login.</p>
</main>
<script>
  // hide the confirmation tokens from the address bar
  try{history.replaceState(null,'',location.pathname)}catch(e){}
</script>
</body>
</html>
